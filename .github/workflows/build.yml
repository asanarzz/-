name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Restore signing key
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > app/debug.keystore; fi
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Rename APK
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VER=$VER" >> $GITHUB_ENV
          cp app/build/outputs/apk/debug/app-debug.apk "CAFEMANAGER.$VER.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: CAFEMANAGER.${{ env.VER }}
          path: CAFEMANAGER.${{ env.VER }}.apk
