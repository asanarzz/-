<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آزمون استعداد یابی متوسطه اول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { font-family: 'Vazirmatn', Tahoma, sans-serif; background: #f2f4f7; color: #1a2233; margin: 0; padding: 16px; }
  .header { text-align: center; margin-bottom: 18px; }
  .header h1 { font-size: 19px; color: #0b3d6e; margin: 0 0 6px; }
  .header p { font-size: 13px; color: #567; margin: 0; }
  .name-box { background: #fff; border-radius: 14px; padding: 14px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
  .name-box label { display:block; font-size:14px; font-weight:600; margin-bottom:6px; }
  .name-box input { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #ccd4e0; font-family: inherit; font-size: 14px; }
  .q-card { background: #fff; border-radius: 14px; padding: 14px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
  .q-text { font-size: 15px; font-weight: 600; margin-bottom: 10px; line-height: 1.6; }
  .opts { display: flex; gap: 8px; flex-wrap: wrap; }
  .opt { flex: 1 1 auto; min-width: 70px; }
  .opt input { display: none; }
  .opt label { display: block; text-align: center; padding: 9px 6px; border-radius: 10px; background: #eef1f6; color: #33445a; font-size: 13px; cursor: pointer; border: 2px solid transparent; }
  .opt input:checked + label { background: #0b6ee0; color: #fff; border-color: #084d9e; font-weight: 600; }
  button[type="submit"] { display: block; width: 100%; background: #0b6ee0; color: #fff; border: none; padding: 16px; border-radius: 14px; font-size: 17px; font-weight: 800; font-family: inherit; margin-top: 20px; cursor: pointer; }
  .note { text-align: center; font-size: 12px; color: #789; margin-top: 10px; }
  .progress { position: sticky; top: 0; background: #f2f4f7; padding: 8px 0; font-size: 12px; color: #567; text-align: center; z-index: 5; }
</style>
</head>
<body>
  <div class="header">
    <h1>سوالات آزمون استعداد یابی دانش آموزان متوسطه اول</h1>
    <p>لطفاً برای هر سوال، گزینه‌ای که بیشترین تطابق را با وضعیت دارد انتخاب کنید.</p>
  </div>

  <div class="progress" id="progress">۰ از ۱۱۲ سوال پاسخ داده شده</div>

  <form id="quizForm" action="https://formsubmit.co/Asannettt@gmail.com" method="POST">
    <input type="hidden" name="_subject" value="پاسخ آزمون استعدادیابی متوسطه اول">
    <input type="hidden" name="_captcha" value="false">
    <div class="name-box">
      <label>نام و نام خانوادگی دانش‌آموز</label>
      <input type="text" name="نام دانش آموز" required>
    </div>

    <div id="questions"></div>

    <button type="submit">ثبت و ارسال پاسخ‌ها</button>
    <div class="note">بعد از زدن دکمه، صفحه تایید نشون داده میشه.</div>
  </form>

<script>
const questions = [
"به محاسبه، اندازه‌گیری یا شمارش علاقه دارم.",
"سر کلاس، در مباحث درسی مشارکت می‌کنم.",
"فعالیت هنری انجام می‌دهم.",
"از درک این که در موقعیتی مشخص احساسات دیگران چیست، عاجز هستم.",
"با تغییر تن صدا و لحن کلام، سعی می‌کنم منظورم را به دیگران بفهمانم.",
"وقت آزادم را صرف یادگیری کارهای فنی (مثل کامپیوتر، ساختمان و نجاری) می‌کنم.",
"وقتی چشمانم را می‌بندم می‌توانم تصاویر واضحی از مکان‌هایی که قبلاً دیده‌ام، ببینم.",
"به انجام کارهای ورزشی علاقه‌مند هستم.",
"بازی‌ها و فعالیت‌های گروهی را به بازی‌ها و فعالیت‌های انفرادی ترجیح می‌دهم.",
"به یادگیری احکام دینی و عمل به تکالیف شرعی علاقه دارم.",
"وجود خطر در کارهای مورد علاقه باعث بی‌خیال شدن آن‌ها نمی‌شود.",
"مفاهیم ریاضی را سریع یاد می‌گیرم.",
"در آزمون‌های کلاسی به‌خوبی عمل می‌کنم.",
"در فعالیت‌ها و مسابقات هنری مدرسه شرکت می‌کنم.",
"اختلافات بین دوستان یا همسالانم را حل می‌کنم.",
"مطالعه کتاب‌های ادبی را بر دیگر کتاب‌ها ترجیح می‌دهم.",
"نرم‌افزارهای جدید را بدون آموزش رسمی می‌آموزم.",
"برای رسیدن به یک مکان و مسیر مشخص می‌توانم از میانبرها استفاده کنم.",
"اطلاعات نسبتاً زیادی در مورد حداقل یک رشته ورزشی دارم.",
"ترجیح می‌دهم شب‌های تعطیل را در یک میهمانی بگذرانم تا تنها در خانه بمانم.",
"به دنبال کسب اطلاعات مذهبی هستم.",
"به سر و کار داشتن با وضعیت‌های نامعلوم و نامشخص علاقه‌مندم.",
"معمولاً در حل مسائل، از راه‌حل‌های کوتاه و ابتکاری استفاده می‌کنم.",
"در موضوعات درسی از خودم توقع زیادی دارم.",
"می‌توانم برای مدت زمان طولانی روی فعالیت هنری تمرکز کنم.",
"شرایط همکاری و مشارکت را در بین دوستان و همسالان فراهم می‌کنم.",
"دروس ادبیات و علوم اجتماعی از دیگر درس‌ها برایم خوشایندتر هستند.",
"ابزارآلات کارهای فنی را می‌شناسم و قادر به استفاده از آن‌ها هستم.",
"می‌توانم قطعات جورچین، لگو و تصاویر به‌هم‌ریخته را (به‌طور سریع) مرتب کنم.",
"به‌طور مرتب در یک ورزش یا فعالیت بدنی شرکت می‌کنم.",
"می‌توانم به‌راحتی با افراد غریبه ارتباط برقرار کنم.",
"رویدادهای زندگی را با معیارهای دینی، برای خودم معنا می‌کنم.",
"علاقه‌مند به کسب تجربه‌های جدید هستم.",
"از بازی‌های منطقی، معماها و فکری (از قبیل شطرنج) لذت می‌برم.",
"به کسب اطلاعات درباره پدیده‌های طبیعی (مثل باران، رعدوبرق، شب و روز) علاقه‌مندم.",
"برای شرکت در فعالیت‌های هنری داوطلب می‌شوم.",
"در گروه‌ها بیشتر نقش سرگروه و رهبر دارم.",
"دنبال یادگیری روش‌هایی برای بهبود ادبیات فارسی‌ام هستم.",
"توانایی و مهارت به خصوصی در استفاده از کامپیوتر دارم.",
"وقتی می‌خوابم، خواب‌های واضحی می‌بینم.",
"به‌عنوان یک بازیکن ثابت در یک تیم دانش‌آموزی حضور فعال دارم.",
"قادر به درک احساسات دیگران و همدلی با همسالان هستم.",
"در انجام فعالیت‌های دینی مدرسه (مانند روخوانی و روان‌خوانی قرآن) پیش‌قدم هستم.",
"پس از هر شکست، هدفم را از طریق دیگری دنبال می‌کنم.",
"به یادگیری ریاضی علاقه خاصی دارم.",
"از فعالیت‌های علمی و انجام آزمایش لذت می‌برم.",
"در کارهای هنری، انتظار و توقع زیادی از خودم دارم.",
"در گروه‌های همسالان و دوستان، مسئولیت‌پذیر هستم.",
"دوست دارم در مورد مطالب مورد علاقه‌ام، بیشتر بخوانم و مطالعه کنم.",
"از ترکیب چند وسیله می‌توانم ابزار جدید ایجاد کنم.",
"جغرافیا از دیگر دروس برایم جذاب‌تر است.",
"حداقل در یک مسابقه ورزشی شرکت کرده‌ام.",
"حداقل سه دوست نزدیک و صمیمی دارم.",
"برای فهم موضوعات دینی (مانند معانی احکام و مفاهیم قرآنی)، تلاش می‌کنم.",
"برای رسیدن به اهدافم، سخت تلاش می‌کنم.",
"محاسبات را به‌صورت ذهنی و بدون نیاز به ماشین‌حساب انجام می‌دهم.",
"برای یادگیری مفاهیم درسی تلاش زیادی می‌کنم.",
"به شرکت در فعالیت‌های هنری علاقه دارم.",
"دیگران مرا به‌عنوان فردی دارای توانایی رهبری گروه می‌شناسند.",
"از بازی با کلمات (مانند جدول کلمات یا جملات به‌هم‌ریخته) لذت می‌برم.",
"به کارهای عملی علاقه‌مندم.",
"می‌توانم تصور کنم (از نگاه یک پرنده)، اجسام از بالا چگونه به نظر می‌رسند.",
"علاقه‌مند به یادگیری تکنیک و حرکات ماهرانه ورزشی هستم.",
"از سرگرمی‌های جمعی بیشتر از سرگرمی‌های فردی خوشم می‌آید.",
"به شرکت در مراسم مذهبی مدرسه علاقه‌مند هستم.",
"یک کار را تا رسیدن به نتیجه ادامه می‌دهم، حتی اگر مدت زمان زیادی طول بکشد.",
"تا رسیدن به پاسخ در مسائل ریاضی دست از تلاش برنمی‌دارم.",
"موضوعات مختلف (مثل شعر، ستاره‌شناسی و...) را به‌راحتی متوجه می‌شوم.",
"می‌توانم با ترکیب چیزهای گوناگون، آثار جدید هنری تولید کنم.",
"در کارهای گروهی، علاقه‌مند به هدایت گروه‌ها و فعالیت‌ها هستم.",
"در مکالماتم به چیزهایی اشاره می‌کنم که قبلاً خوانده یا شنیده‌ام.",
"کار کردن با ابزارهای برقی و الکترونیکی را بلد هستم.",
"می‌توانم به‌راحتی اسامی اشیا و مکان‌ها را به یاد بیاورم.",
"مهارت خاصی در انجام حرکات ورزشی دارم.",
"از آموزش دانسته‌هایم به دیگران لذت می‌برم.",
"به کتب و آموزش‌های مذهبی علاقه دارم.",
"برای حل مسائل اغلب تلاش زیادی می‌کنم و نمی‌توانم به‌راحتی از آن‌ها بگذرم.",
"به‌راحتی می‌توانم مفاهیم منطقی را در ذهنم طبقه‌بندی کنم.",
"در وقت آزادم در مورد موضوعات علمی مطالعه می‌کنم.",
"با مؤسسه‌ها و مراکز هنری ارتباط دارم.",
"مسئولیت فعالیت‌های گروهی مانند تهیه روزنامه دیواری و غیره را به عهده می‌گیرم.",
"شعر خواندن را دوست دارم.",
"علاقه‌مند به تحقیق پیرامون فن‌آوری هستم.",
"می‌توانم به‌طور واضح و قابل‌فهم آدرس مکان‌های مختلف را بیان کنم.",
"نمره‌هایم در کلاس ورزش بالا است.",
"در میان جمع احساس راحتی می‌کنم.",
"سعی می‌کنم اعمال دینی‌ام (نماز و روزه) قضا نشود.",
"کارهای سخت را به کارهای آسان ترجیح می‌دهم.",
"جزئیات دقیقی از مباحث ریاضی سال‌های قبل را به خاطر می‌آورم.",
"در زمینه‌های علمی، کنجکاوم.",
"اطلاعات هنری‌ام خوب است.",
"در فعالیت‌های انتخاباتی مدرسه مانند انجمن‌های دانش‌آموزی مشارکت دارم.",
"نوشتن شعر و متون ادبی یکی از فعالیت‌های مورد علاقه‌ام است.",
"علاقه‌مند به کارهای فنی ـ مکانیکی هستم.",
"می‌توانم شکل‌های هندسی را بعد از یک نگاه کوتاه به خاطر سپارم.",
"حرکات ورزشی را به‌طور سریع و دقیق یاد می‌گیرم.",
"در فعالیت‌های مدرسه و فعالیت‌های اجتماعی شرکت می‌کنم.",
"عبادات مذهبی را به جای می‌آورم.",
"دست‌وپنجه نرم کردن با مسئله پیچیده، از حل مسئله آسان برایم جالب‌تر است.",
"برای مدت زمان طولانی می‌توانم بر روی یک مسئله منطقی فکر کنم.",
"به موضوعات علمی علاقه دارم.",
"آموزش‌های هنری را سریعاً یاد می‌گیرم.",
"در گروه‌ها، رفتارم طوری است که منجر به همکاری بهتر دیگران در فعالیت‌ها می‌شود.",
"به کتاب و کتاب‌خوانی علاقه دارم.",
"در منزل تعمیرات ساده وسایل را انجام می‌دهم.",
"از معماهای دیداری (مانند پازل‌ها، لگو و تصاویر سه‌بعدی) لذت می‌برم.",
"در فعالیت‌های فیزیکی (دوچرخه‌سواری، فوتبال، شنا و تنیس) به‌خوبی عمل می‌کنم.",
"می‌توانم به‌راحتی با برنامه‌های گروهی هماهنگ شوم.",
"از بحث و گفتگوهای مذهبی لذت می‌برم.",
"در یک بازی رقابتی، بهتر بازی کردن برایم مهم است نه برنده شدن.",
"هنگام مواجهه با یک اثر هنری، به جزئیات آن توجه می‌کنم.",
"زندگی‌نامه بزرگان دین را مطالعه می‌کنم."
];

const opts = ["هرگز", "گاهی", "اغلب اوقات", "همیشه"];
const container = document.getElementById('questions');

questions.forEach((q, i) => {
  const num = i + 1;
  const card = document.createElement('div');
  card.className = 'q-card';
  const qText = document.createElement('div');
  qText.className = 'q-text';
  qText.textContent = num + ". " + q;
  card.appendChild(qText);
  const optsDiv = document.createElement('div');
  optsDiv.className = 'opts';
  opts.forEach((opt, j) => {
    const wrap = document.createElement('div');
    wrap.className = 'opt';
    const id = "q" + num + "_" + j;
    wrap.innerHTML = `<input type="radio" id="${id}" name="${num}. ${q}" value="${opt}" required>
      <label for="${id}">${opt}</label>`;
    optsDiv.appendChild(wrap);
  });
  card.appendChild(optsDiv);
  container.appendChild(card);
});

const progressEl = document.getElementById('progress');
document.getElementById('quizForm').addEventListener('change', () => {
  const answered = new Set();
  document.querySelectorAll('input[type=radio]:checked').forEach(r => answered.add(r.name));
  progressEl.textContent = answered.size + " از " + questions.length + " سوال پاسخ داده شده";
});
</script>
</body>
</html>
