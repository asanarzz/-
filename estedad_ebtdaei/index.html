<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آزمون استعداد یابی دانش آموزان ابتدایی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { font-family: 'Vazirmatn', Tahoma, sans-serif; background: #f2f4f7; color: #1a2233; margin: 0; padding: 16px; }
  .header { text-align: center; margin-bottom: 18px; }
  .header h1 { font-size: 19px; color: #0b3d6e; margin: 0 0 6px; }
  .header p { font-size: 13px; color: #567; margin: 0; }
  .name-box { background: #fff; border-radius: 14px; padding: 14px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
  .name-box label { display:block; font-size:14px; font-weight:600; margin-bottom:6px; }
  .name-box input { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #ccd4e0; font-family: inherit; font-size: 14px; }
  .q-card { background: #fff; border-radius: 14px; padding: 14px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
  .q-text { font-size: 15px; font-weight: 600; margin-bottom: 10px; line-height: 1.6; }
  .opts { display: flex; gap: 8px; flex-wrap: wrap; }
  .opt { flex: 1 1 auto; min-width: 70px; }
  .opt input { display: none; }
  .opt label { display: block; text-align: center; padding: 9px 6px; border-radius: 10px; background: #eef1f6; color: #33445a; font-size: 13px; cursor: pointer; border: 2px solid transparent; }
  .opt input:checked + label { background: #0b6ee0; color: #fff; border-color: #084d9e; font-weight: 600; }
  button[type="submit"] { display: block; width: 100%; background: #0b6ee0; color: #fff; border: none; padding: 16px; border-radius: 14px; font-size: 17px; font-weight: 800; font-family: inherit; margin-top: 20px; cursor: pointer; }
  .note { text-align: center; font-size: 12px; color: #789; margin-top: 10px; }
  .progress { position: sticky; top: 0; background: #f2f4f7; padding: 8px 0; font-size: 12px; color: #567; text-align: center; z-index: 5; }
</style>
</head>
<body>
  <div class="header">
    <h1>سوالات آزمون استعداد یابی دانش آموزان ابتدایی</h1>
    <p>لطفاً برای هر سوال، گزینه‌ای که بیشترین تطابق را با وضعیت دارد انتخاب کنید.</p>
  </div>

  <div class="progress" id="progress">۰ از ۹۵ سوال پاسخ داده شده</div>

  <form id="quizForm" action="https://formsubmit.co/Asannettt@gmail.com" method="POST">
    <input type="hidden" name="_subject" value="پاسخ آزمون استعدادیابی ابتدایی">
    <input type="hidden" name="_captcha" value="false">
    <div class="name-box">
      <label>نام و نام خانوادگی دانش‌آموز</label>
      <input type="text" name="نام دانش آموز" required>
    </div>

    <div id="questions"></div>

    <button type="submit">ثبت و ارسال پاسخ‌ها</button>
    <div class="note">بعد از زدن دکمه، صفحه تایید نشون داده میشه.</div>
  </form>

<script>
const questions = [
"به آسانی می‌تواند به آنچه مسئله (یا معما) از او می‌خواهد، پی ببرد.",
"در زمینه‌های درسی خاصی، دانش و اطلاعات خوبی دارد.",
"در آثار و عملکردهای هنری، می‌تواند نکات ظریف را درک کند.",
"می‌تواند اختلافات بین افراد را حل کند.",
"برای اطمینان از نتایج آزمون در اینجا گزینه هرگز را انتخاب کنید.",
"مطالب را با دقت و خلاصه می‌نویسد.",
"در کارهای فنی (مثل کار با کامپیوتر، برق، خیاطی یا نجاری) مهارت خوبی دارد.",
"چگونگی قرارگرفتن افراد و اشیا در کنار هم را با یک نگاه کوتاه به خاطر می‌سپارد.",
"به‌طور مداوم، حرکات ورزشی را انجام می‌دهد.",
"به‌راحتی با همسالان رابطه دوستانه برقرار می‌کند.",
"تمایل به آموختن احکام (مانند احکام نماز، روزه و طهارت) دارد.",
"به سر و کار داشتن با وضعیت مبهم و نامعلوم علاقه‌مند است.",
"اطلاعات جدید را می‌تواند سریع یاد بگیرد.",
"تکالیف تحصیلی‌اش را بدون کمک دیگران انجام می‌دهد.",
"اطلاعات هنری خوبی دارد.",
"با دیگران مشارکت و همکاری می‌کند.",
"روایت‌گر خوب و جذاب پیشامدها و وقایع است.",
"مهارت خوبی در استفاده از ابزارهای فنی یا فناورانه دارد.",
"می‌تواند قطعات جورچین، لگو و تصاویر را سریع مرتب کند.",
"در یک یا چند حوزه ورزشی برجسته است (مانند ژیمناستیک، فوتبال، تنیس).",
"قادر به برقراری ارتباط با افراد غریبه است.",
"وقتی می‌خواهد چیزی را تغییر دهد، سخت تلاش می‌کند.",
"مسائل سخت و مفهومی را درک می‌کند.",
"نسبت به بحث در مورد موضوعات علمی اشتیاق دارد.",
"تولیدات و آثار هنری خلق می‌کند.",
"در گروه‌های همسالان رفتارهای مسئولیت‌پذیرانه دارد.",
"در نوشتن از واژگان مناسب استفاده می‌کند.",
"برای یادگیری جدید از برنامه‌های کمک آموزشی استفاده می‌کند.",
"می‌تواند شکل‌ها و فرم‌های اشیا را از زوایای مختلف توضیح داده و رسم کند.",
"در مورد یک یا چند رشته ورزشی اطلاعات خوبی دارد.",
"بدون مشکل در هر موقعیت، دوست یا همبازی پیدا می‌کند.",
"با مراکز دینی و قرآنی (مانند مسجد، دارالقرآن، هیئت و جلسات مذهبی)، در ارتباط است.",
"پس از هر شکست، برای موفقیت‌های آتی، برنامه جدید دارد.",
"به صورت منطقی و درست، نتیجه‌گیری می‌کند.",
"در وقت آزاد در مورد موضوعات علمی مطالعه می‌کند.",
"نسبت به شرکت در فعالیت‌های هنری مشتاق است.",
"به‌خوبی با دیگران ارتباط برقرار می‌کند.",
"دامنه لغات وسیعی دارد.",
"مهارت به خصوصی در استفاده از کامپیوتر و فضای مجازی دارد.",
"قادر است تصاویر سه‌بعدی را درک کند.",
"به‌طور منظم حداقل در یک رشته ورزشی یا فعالیت بدنی شرکت می‌کند.",
"ارتباطات اجتماعی خوبی دارد.",
"وقایع و رویدادها را با رویکرد دینی تفسیر می‌کند.",
"پس از کسب یک هدف، سریعاً هدفی بالاتر را برای گام بعدی انتخاب می‌کند.",
"محاسبات عددی نسبتاً سخت را بدون نیاز به ماشین‌حساب حل می‌کند.",
"مجموعه وسیعی از اطلاعات در مورد یک موضوع درسی دارد.",
"با ترکیب موضوعات هنری متفاوت (مثلاً نقاشی و خط)، آثار جدید هنری تولید می‌کند.",
"در جمع همسالان، به‌عنوان سرتیم، مدیر و رهبر شناخته می‌شود.",
"برای درک متون ادبی و شعرهای دشوار، تلاش زیادی می‌کند.",
"از ترکیب چند وسیله، می‌تواند ابزار جدید ایجاد کند.",
"جغرافیا و کار با نقشه را به درس‌های دیگر ترجیح می‌دهد.",
"برای اطمینان از نتایج آزمون در اینجا گزینه گاهی را انتخاب کنید.",
"رویدادهای ورزشی را به طور منظم پیگیری می‌کند.",
"با دیگران همدلی می‌کند.",
"در انجام فعالیت‌های دینی مدرسه (نظیر قرائت قرآن و اقامه نماز) پیش‌قدم است.",
"برای اطمینان از نتایج آزمون در اینجا گزینه اغلب اوقات را انتخاب کنید.",
"کارهایی که توانایی‌اش را افزایش می‌دهد، به کارهای آسان ترجیح می‌دهد.",
"قادر به انجام عملیات نسبتاً دشوار محاسباتی است.",
"نسبت به فرآیندهای علمی کنجکاو است.",
"افکارش را به‌طور قانع‌کننده‌ای بیان می‌نماید.",
"شاعر مسلک است.",
"برای اطمینان از نتایج آزمون در اینجا گزینه هرگز را انتخاب کنید.",
"شیوه‌های کار با ابزارهای عملی و فنی را می‌داند.",
"قادر است بیان کند اجسام زمانی که از بالا به آن نگاه می‌کنیم، چگونه به نظر می‌رسند.",
"به‌عنوان یک بازیکن ثابت در یک تیم دانش‌آموزی حضور فعال دارد.",
"دوستان نزدیک و صمیمی زیادی دارد.",
"در مورد مسائل دینی زیاد سؤال می‌پرسد.",
"اهل چالش و محک‌زدن خود است.",
"مهارت‌های قابل‌توجهی در دسته‌بندی و یا طبقه‌بندی اشیا و رویدادها از خود نشان می‌دهد.",
"پرسش‌های عمیق و مفهومی در مورد موضوعات مطرح می‌کند.",
"برای اطمینان از نتایج آزمون در اینجا گزینه همیشه را انتخاب کنید.",
"در کارهای هنری، هماهنگی و تناسب را رعایت می‌کند.",
"در کنار آمدن و ارتباط با همکلاسی‌هایش، اعتمادبه‌نفس دارد.",
"در راه‌اندازی و اجرای فعالیت‌های ادبی مدرسه (مثل کتاب‌خوانی و شب شعر) حضور فعال دارد.",
"سؤالات زیادی در مورد فناوری‌های به کار رفته در وسایل خانگی و ماشین‌آلات می‌پرسد.",
"می‌تواند به‌طور صریح و قابل‌فهم، آدرس مکان‌ها را بیان کند.",
"قادر است یک رشته ورزشی را به گروهی از کودکان کم‌سن‌وسال‌تر آموزش دهد.",
"در فعالیت‌های اجتماعی مدرسه شرکت می‌کند.",
"با اشتیاق در مناسبت‌های مذهبی (مانند عزاداری‌ها، جشن‌های مذهبی، دعاخوانی و محافل قرآنی) حضور پیدا می‌کند.",
"پیش‌قدم در انجام کارهای دشوار است.",
"برای مدت طولانی، می‌تواند بر یک فعالیت تحصیلی مشخص تمرکز کند.",
"می‌تواند بر فعالیت‌های علمی و طبیعی تمرکز کند.",
"مسئولیت فعالیت‌های گروهی مانند تهیه روزنامه دیواری را به عهده می‌گیرد.",
"مطالعه کتاب‌های ادبی یا اشعار را بر دیگر کتاب‌ها ترجیح می‌دهد.",
"دوست دارد نحوه ساخت وسایل فنی را بداند.",
"حافظه خوبی در مورد جزئیات اجسام و اشکال دارد.",
"مدرسه و معلم‌ها امیدوار به موفقیت ایشان در یک رشته ورزشی هستند.",
"قادر است با برنامه‌های تیمی هماهنگ شود.",
"به کتاب‌های دینی (مانند قرآن، نهج‌البلاغه و صحیفه سجادیه) و آموزه‌های اهل بیت علاقه دارد.",
"رعایت قواعد بازی، برایش مهم‌تر از برنده شدن در بازی است.",
"هنر و هنرمندی برایش ارزشمند است.",
"از بحث و گفتگو در مورد مذهب لذت می‌برد.",
"به مطالعه و شنیدن زندگی‌نامه بزرگان دینی علاقه دارد.",
"زمان‌های طولانی برای انجام و اصلاح کارهای هنری صرف می‌کند.",
"در کارهای هنری، توقع زیادی از خود دارد."
];

const opts = ["هرگز", "گاهی", "اغلب اوقات", "همیشه"];
const container = document.getElementById('questions');

questions.forEach((q, i) => {
  const num = i + 1;
  const card = document.createElement('div');
  card.className = 'q-card';
  const qText = document.createElement('div');
  qText.className = 'q-text';
  qText.textContent = num + ". " + q;
  card.appendChild(qText);
  const optsDiv = document.createElement('div');
  optsDiv.className = 'opts';
  opts.forEach((opt, j) => {
    const wrap = document.createElement('div');
    wrap.className = 'opt';
    const id = "q" + num + "_" + j;
    wrap.innerHTML = `<input type="radio" id="${id}" name="${num}. ${q}" value="${opt}" required>
      <label for="${id}">${opt}</label>`;
    optsDiv.appendChild(wrap);
  });
  card.appendChild(optsDiv);
  container.appendChild(card);
});

const progressEl = document.getElementById('progress');
document.getElementById('quizForm').addEventListener('change', () => {
  const answered = new Set();
  document.querySelectorAll('input[type=radio]:checked').forEach(r => answered.add(r.name));
  progressEl.textContent = answered.size + " از " + questions.length + " سوال پاسخ داده شده";
});
</script>
</body>
</html>
