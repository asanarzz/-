<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آزمون غربالگری دانش‌آموزان ابتدایی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    background: #f2f4f7;
    color: #1a2233;
    margin: 0;
    padding: 16px;
  }
  .header { text-align: center; margin-bottom: 18px; }
  .header h1 { font-size: 19px; color: #0b3d6e; margin: 0 0 6px; }
  .header p { font-size: 13px; color: #567; margin: 0; }
  .name-box {
    background: #fff;
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }
  .name-box label { display:block; font-size:14px; font-weight:600; margin-bottom:6px; }
  .name-box input {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid #ccd4e0;
    font-family: inherit;
    font-size: 14px;
  }
  .q-card {
    background: #fff;
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }
  .q-text { font-size: 15px; font-weight: 600; margin-bottom: 10px; line-height: 1.6; }
  .opts { display: flex; gap: 8px; flex-wrap: wrap; }
  .opt { flex: 1 1 auto; min-width: 70px; }
  .opt input { display: none; }
  .opt label {
    display: block;
    text-align: center;
    padding: 9px 6px;
    border-radius: 10px;
    background: #eef1f6;
    color: #33445a;
    font-size: 13px;
    cursor: pointer;
    border: 2px solid transparent;
  }
  .opt input:checked + label {
    background: #0b6ee0;
    color: #fff;
    border-color: #084d9e;
    font-weight: 600;
  }
  button[type="submit"] {
    display: block;
    width: 100%;
    background: #0b6ee0;
    color: #fff;
    border: none;
    padding: 16px;
    border-radius: 14px;
    font-size: 17px;
    font-weight: 800;
    font-family: inherit;
    margin-top: 20px;
    cursor: pointer;
  }
  .note { text-align: center; font-size: 12px; color: #789; margin-top: 10px; }
  .progress {
    position: sticky;
    top: 0;
    background: #f2f4f7;
    padding: 8px 0;
    font-size: 12px;
    color: #567;
    text-align: center;
    z-index: 5;
  }
</style>
</head>
<body>
  <div class="header">
    <h1>سوالات آزمون غربالگری دانش‌آموزان ابتدایی</h1>
    <p>لطفاً برای هر سوال، گزینه‌ای که بیشترین تطابق را با وضعیت دارد انتخاب کنید.</p>
  </div>

  <div class="progress" id="progress">۰ از ۱۱۶ سوال پاسخ داده شده</div>

  <form id="quizForm" action="https://formsubmit.co/Asannettt@gmail.com" method="POST">
    <input type="hidden" name="_subject" value="پاسخ آزمون غربالگری ابتدایی">
    <input type="hidden" name="_captcha" value="false">
    <div class="name-box">
      <label>نام و نام خانوادگی دانش‌آموز</label>
      <input type="text" name="نام دانش آموز" required>
    </div>

    <div id="questions"></div>

    <button type="submit">ثبت و ارسال پاسخ‌ها</button>
    <div class="note">بعد از زدن دکمه، صفحه تایید نشون داده میشه.</div>
  </form>

<script>
const questions = [

"از مراقبت دیگران (مثلا خواهر و برادر یا کودک کوچک‌تر) بیزار است.",
"وقتی ناراحت است، تقصیر را گردن چیزهایی یا کسانی می‌اندازد که ربطی به مساله ندارند.",
"توانایی نه گفتن به خواسته‌های نامناسب دوستانش را دارد.",
"چیزهایی که دیگران دارند (مانند استعداد، قیافه و خانواده) را بهتر یا بیشتر از داشته‌های خود می‌داند.",
"انجام تکالیف مدرسه‌ برایش کسالت‌آور است.",
"انتظار دارد در آینده اتفاقات خوبی برایش رخ دهد.",
"از خودش در حد توانایی‌هایش انتظار دارد.",
"هر زمان لازم باشد، برای یادگیری بهتر درس‌ها، زمان بیشتری صرف می‌کند.",
"اعتماد به نفس‌اش ضعیف است.",
"برای اطمینان از نتایج آزمون در اینجا گزینه اغلب اوقات را انتخاب کنید.",
"دوست یا دوستان تقریبا هم‌سنی دارد که با آنان بازی و وقت‌گذرانی می‌کند.",
"فکر می‌کند در مدرسه هیچ توجهی به نظراتش نمی‌شود.",
"به نظرش در خانواده تصمیمات طوری گرفته می‌شود که به نفع همه اعضاء باشد.",
"اگر بیماری یا اتفاق ناگواری برای یکی از دوستانش رخ دهد، تا مدتی ناراحت است.",
"در مواردی حتی اگر ناراحت باشد، باز هم می‌تواند کارهایش را پیش ببرد.",
"قبل از انجام هر کاری، به پیامدها و نتایج آن فکر می‌کند.",
"برای اطمینان از نتایج آزمون در اینجا گزینه هرگز را انتخاب کنید.",
"سعی می‌کند حتی از داشته‌های کوچک‌اش، لذت ببرد.",
"از شوق رفتن به مدرسه، راحت از رختخواب جدا می‌شود.",
"باور دارد که سرانجام کارهایش با موفقیت همراه خواهد بود.",
"می‌داند در زندگی چه چیزی برایش مهم و کدام غیرمهم است.",
"وظایفی را که در منزل به او داده می‌شود، سَرسَری می‌گیرد.",
"از عهده کارهایش برمی‌آید.",
"اگر غایب شود، همکلاسی‌هایش بلافاصله سراغش را می‌گیرند.",
"احساس می‌کند مدرسه تا جایی که بتواند، در حل مشکلات به او کمک می‌کند.",

"هنگام مطالعه یا تماشای فیلم، سریع با شخصیت‌ها احساس هم‌زادپنداری می‌کند.",

"خودش را فردی خوش‌شانس می‌داند.",
"هنگام فعالیت‌ها مرتباً از این شاخه به آن شاخه می‌پرد.",
"هنگامی‌که از او کاری خواسته شود که توانایی یا حوصله انجام آن را نداشته باشد، دادوقال راه می‌اندازد.",
"تنها ماندن در خانه یا مکانی دیگر برایش دشوار است.",
"کرخت، خمود یا بی‌حال است.",
"مواظب است زخمی نشود یا آسیبی نبیند.",
"من و همسرم از او راضی هستیم.",
"برای انجام کارها، لازم است مرحله به مرحله آن را برایش توضیح داد.",
"تمایل دارد از تختخواب مشترک با والدین، خواهر یا برادر استفاده کند.",
"از انتظار برای نوبت (مثلاً در بازی و ایستادن در صف) ناتوان است.",
"برای فرونشاندن خشم و عصبانیت خود از دیگران انتقام می‌گیرد.",
"از این که دیگران در مورد او چه فکری می‌کنند، نگران است.",
"بیان می‌کند افراد خانواده یا مدرسه دیگر او را دوست ندارند.",
"تهدیدها و صحبت‌هایی در مورد آسیب به خود به زبان می‌آورد.",
"سر موضوع رعایت پوشش و ظاهر، با اعضای خانواده اختلاف دارد.",
"می‌تواند به‌تنهایی از عهده انجام وظایف برآید.",
"به بازی‌ها و تفریحات گروهی علاقه‌مند است.",
"برای اطمینان از نتایج آزمون در اینجا گزینه گاهی را انتخاب کنید.",
"در تکالیفی که نیازمند فعالیت ذهنی مداوم است، خوب عمل می‌کند.",
"رفتارهای پرخاشگرانه از خود نشان می‌دهد.",
"بدون دلیل دلشوره دارد.",
"گوشه‌گیر است.",
"هنگام ناکامی و عصبانیت خودش را مورد ضرب و شتم قرار می‌دهد.",
"اختلافات کوچک و تفاوت در سلیقه‌ها با او، به ناراحتی و دعوا منجر می‌شود.",
"در آراستن و مرتب کردن سر و وضع خود ضعف دارد.",
"برای اطمینان از نتایج آزمون در اینجا گزینه همیشه را انتخاب کنید.",
"عفونت مجاری ادراری یا دردهای شکمی بدون دلیل دارد.",
"اسباب‌بازی‌ها و اشیای لازم برای بازی و فعالیت‌ها را گم می‌کند.",
"با افراد بزرگ‌سال جر و بحث بی‌دلیل می‌کند.",
"با موقعیت‌های جدید سریع سازگار می‌شود.",
"اشتیاقش نسبت به بازی‌ها و کارهای مورد علاقه‌اش کم شده است.",
"موی سر، ابرو یا مژه خود را می کَند.",
"با اعضای خانواده، رفتار تند، بگومگو و مشاجره دارد.",
"برای اطمینان از نتایج آزمون در اینجا گزینه هرگز را انتخاب کنید.",
"در قبال خانواده فاقد مسئولیت‌پذیری است.",
"حرکات و رفتارهای جنسی در صحبت، بازی یا نقاشی از خود نشان می‌دهد.",
"بی قرار است و یکجا بند نمی شود.",
"رفتار‌هايي از خود نشان مي‌دهد كه از نظر دیگران خطرناک‌اند.",
"از صحبت کردن یا انجام فعالیت در برابر نگاه دیگران می ترسد.",
"به آینده امیدوار است.",
"با اشيا نوک‌تیز مانند مداد، نقطه‌ای از بدنش را زخم مي‌كند.",
"دوستانی دارد که از نظر خانواده نامناسب هستند.",
"برای انجام کارهای شخصی اش نیاز به راهنمایی و تایید دیگران دارد.",
"رفتارهای جنسی نامتناسب با سن خود بروز می‌دهد.",
"در فعالیت‌های روزمره (مثلا در انجام تکالیف و مسئولیت های خانگی) فراموشكار است.",
"حیوانات را اذیت می‌کند.",
"از حضور در مکان های ناآشنا یا شلوغ می‌ترسد.",
"بی‌هیچ دلیلی گريه مي‌كند.",
"قسمتي از بدنش را كه زخم شده، آن‌قدر دست‌کاری مي‌كند كه خونريزي كند.",
"قوانین خانه (مانند ساعت خواب، استفاده از گوشی و آمدورفت) را نادیده می گیرید.",
"از برنامه ریزی برای انجام تکالیفش ناتوان است.",
"فکرهای تکرارشونده درباره ی تهدید یا آسیب دیدن دارد.",
"همواره از فعالیت‌های سلبریتی محبوبش صحبت می‌کند.",
"در فضای مجازی برایش پیام‌های تهدید یا توهین ارسال می‌شود.",
"زمان محدود و کنترل‌شده‌ای را صرف گوشی و فضای مجازی می‌کند.",
"با کسانی دوستی می‌کند که به سلبریتی محبوبش علاقه‌مندند.",
"شخصی بدون اجازه او، تصویری خجالت‌آور از او (مثلاً عکس در حال تعویض‌ لباس) را در فضای مجازی منتشر کرده است.",
"به دلیل صَرف زمان زیاد برای فضای مجازی، افت‌تحصیلی پیدا کرده است.",
"سبک زندگی (عادات روزانه یا روابط شخصی) سلبریتی محبوبش را تقلید می‌کند.",
"شخصی برای اذیت‌کردن، او را از یک گروه مجازی (برای مثال گروه دوستان و هم‌کلاسی‌ها) حذف کرده است.",
"اگر سرگرم فضای مجازی نباشد، احساس کلافگی می‌کند.",
"یادگاری‌هایی (مانند عکس) از سلبریتی محبوبش به همراه دارد یا در محلی خاص نگهداری می‌کند.",
"در فضای مجازی نام مستعار ناپسندی به او منتسب شده است.",
"وقتی مشغول کاری است، حواسش پیش فضای مجازی است.",
"وقتی اتفاق بدی برای سلبریتی محبوبش می‌افتد، ناراحت می‌شود.",
"فرزندم در فضای مجازی، مورد تمسخر قرار می‌گیرد.",
"ترجیح می‌دهد به‌جای بودن در کنار دوستانش، در فضای مجازی باشد."
];

const opts = ["هرگز", "گاهی", "اغلب اوقات", "همیشه"];
const container = document.getElementById('questions');

questions.forEach((q, i) => {
  const num = i + 1;
  const card = document.createElement('div');
  card.className = 'q-card';

  const qText = document.createElement('div');
  qText.className = 'q-text';
  qText.textContent = num + ". " + q;
  card.appendChild(qText);

  const optsDiv = document.createElement('div');
  optsDiv.className = 'opts';

  opts.forEach((opt, j) => {
    const wrap = document.createElement('div');
    wrap.className = 'opt';
    const id = "q" + num + "_" + j;
    wrap.innerHTML = `<input type="radio" id="${id}" name="${num}. ${q}" value="${opt}" required>
      <label for="${id}">${opt}</label>`;
    optsDiv.appendChild(wrap);
  });

  card.appendChild(optsDiv);
  container.appendChild(card);
});

const progressEl = document.getElementById('progress');
document.getElementById('quizForm').addEventListener('change', () => {
  const answered = new Set();
  document.querySelectorAll('input[type=radio]:checked').forEach(r => answered.add(r.name));
  progressEl.textContent = answered.size + " از " + questions.length + " سوال پاسخ داده شده";
});
</script>
</body>
</html>
